<!doctype html>
<html lang="en"{% if theme in ("light", "dark") %} data-theme="{{ theme }}"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if refresh %}<meta http-equiv="refresh" content="{{ refresh }}">{% endif %}
<title>{% block title %}Atchinson Rd Crossing Noise{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='thm.css') }}">
<script src="{{ url_for('static', filename='thm-charts.js') }}"></script>
</head>
<body{% if embed %} class="embed"{% endif %}>
{% block body %}{% endblock %}
</body>
</html>
